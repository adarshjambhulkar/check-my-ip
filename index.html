<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check My IP</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /*
         * 3-color system (60-30-10)
         *   60% dominant  - neutral navy: page base, glass surfaces, text
         *   30% secondary - sky: background blobs, tile tint, hover borders
         *   10% accent    - orange: primary action, CIDR badge, focus, copied state
         */
        :root,
        [data-bs-theme="dark"] {
            /* 60 - dominant */
            --page-bg: #0a0f1c;
            --text-main: #eef0f8;
            --text-muted: rgba(238, 240, 248, .6);
            --glass-bg: rgba(255, 255, 255, .06);
            --glass-border: rgba(255, 255, 255, .12);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, .45);

            /* 30 - secondary */
            --secondary: #0ea5e9;
            --secondary-rgb: 14, 165, 233;
            --glass-tile: rgba(var(--secondary-rgb), .08);
            --glass-tile-hover: rgba(var(--secondary-rgb), .16);

            /* 10 - accent */
            --accent: #fb923c;
            --accent-rgb: 251, 146, 60;
            --on-accent: #1a0b00;
        }

        [data-bs-theme="light"] {
            /* 60 - dominant */
            --page-bg: #f1f6fb;
            --text-main: #151a30;
            --text-muted: rgba(21, 26, 48, .6);
            --glass-bg: rgba(255, 255, 255, .5);
            --glass-border: rgba(255, 255, 255, .8);
            --glass-shadow: 0 20px 50px rgba(40, 45, 90, .14);

            /* 30 - secondary */
            --secondary: #0ea5e9;
            --secondary-rgb: 14, 165, 233;
            --glass-tile: rgba(var(--secondary-rgb), .07);
            --glass-tile-hover: rgba(var(--secondary-rgb), .13);

            /* 10 - accent */
            --accent: #f97316;
            --accent-rgb: 249, 115, 22;
            --on-accent: #1a0b00;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--page-bg);
            color: var(--text-main);
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            transition: background .4s ease, color .4s ease;
        }

        /* ---------- Background blobs ---------- */
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            background: var(--secondary);
            animation: float 18s ease-in-out infinite;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            opacity: .55;
            top: -120px;
            left: -100px;
        }

        .blob-2 {
            width: 380px;
            height: 380px;
            opacity: .4;
            bottom: -120px;
            right: -80px;
            animation-delay: -6s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            opacity: .25;
            top: 40%;
            left: 55%;
            animation-delay: -12s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -30px) scale(1.08);
            }

            66% {
                transform: translate(-30px, 30px) scale(.95);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blob {
                animation: none;
            }
        }

        /* ---------- Glass ---------- */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .15);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            padding: 28px;
        }

        .glass-tile {
            background: var(--glass-tile);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background .2s ease, transform .2s ease;
        }

        .glass-tile:hover {
            background: var(--glass-tile-hover);
            transform: translateY(-1px);
        }

        /* ---------- Text ---------- */
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: .875rem;
        }

        .section-title {
            font-size: .95rem;
            font-weight: 600;
            margin: 0;
        }

        .ip-label {
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .ip-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-all;
            min-height: 1.8rem;
        }

        .ip-value.muted,
        .ip-value.loading {
            font-size: .95rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .ip-value.loading {
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .4;
            }
        }

        .min-w-0 {
            min-width: 0;
        }

        .cidr {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: .75rem;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(var(--accent-rgb), .14);
            border: 1px solid rgba(var(--accent-rgb), .45);
            color: var(--text-main);
        }

        /* ---------- Buttons ---------- */
        .icon-btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 36px;
            min-width: 36px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass-tile);
            color: var(--text-main);
            font-size: .8rem;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, color .2s ease;
        }

        .icon-btn:hover {
            background: var(--glass-tile-hover);
            border-color: rgba(var(--secondary-rgb), .6);
        }

        .icon-btn:focus-visible,
        .refresh-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .icon-btn.copied {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .refresh-btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 0;
            border-radius: 14px;
            color: var(--on-accent);
            font-weight: 600;
            background: var(--accent);
            box-shadow: 0 8px 24px rgba(var(--accent-rgb), .3);
            transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
        }

        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(var(--accent-rgb), .4);
        }

        .refresh-btn:disabled {
            opacity: .75;
        }

        .refresh-btn svg {
            width: 18px;
            height: 18px;
        }

        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Toast ---------- */
        .toast.glass-toast {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            .glass {
                padding: 20px;
                border-radius: 20px;
            }

            .ip-value {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- SVG icon sprites -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
        </symbol>
    </svg>

    <main class="app">
        <div class="glass">
            <div class="d-flex align-items-center justify-content-between mb-4 gap-3">
                <div>
                    <h1 class="title">Check My IP</h1>
                    <div class="subtitle">Your public IPv4 and IPv6 addresses</div>
                </div>
                <button class="icon-btn" type="button" id="themeToggle" aria-label="Switch to light theme"
                    title="Toggle theme">
                    <svg><use href="#i-sun" /></svg>
                </button>
            </div>

            <!-- IPv4 -->
            <div class="glass-tile mb-3 d-flex align-items-center gap-3">
                <div class="flex-grow-1 min-w-0">
                    <div class="ip-label">IPv4</div>
                    <div class="ip-value loading" id="ipAddress">Fetching...</div>
                </div>
                <button class="icon-btn" type="button" data-copy="ipAddress" title="Copy" aria-label="Copy IPv4">
                    <svg><use href="#i-copy" /></svg>
                </button>
            </div>

            <!-- IPv6 -->
            <div class="glass-tile mb-4 d-flex align-items-center gap-3">
                <div class="flex-grow-1 min-w-0">
                    <div class="ip-label">IPv6</div>
                    <div class="ip-value loading" id="ipv6Address">Fetching...</div>
                </div>
                <button class="icon-btn" type="button" data-copy="ipv6Address" title="Copy" aria-label="Copy IPv6">
                    <svg><use href="#i-copy" /></svg>
                </button>
            </div>

            <!-- Subnet -->
            <div class="d-flex align-items-center justify-content-between mb-2">
                <h2 class="section-title">IPv4 Subnet Range</h2>
                <span class="cidr" id="subnetCidr">-</span>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-sm">
                    <div class="glass-tile d-flex align-items-center gap-3 h-100">
                        <div class="flex-grow-1 min-w-0">
                            <div class="ip-label">Start</div>
                            <div class="ip-value loading" id="startRange">-</div>
                        </div>
                        <button class="icon-btn" type="button" data-copy="startRange" title="Copy" aria-label="Copy start range">
                            <svg><use href="#i-copy" /></svg>
                        </button>
                    </div>
                </div>
                <div class="col-sm">
                    <div class="glass-tile d-flex align-items-center gap-3 h-100">
                        <div class="flex-grow-1 min-w-0">
                            <div class="ip-label">End</div>
                            <div class="ip-value loading" id="endRange">-</div>
                        </div>
                        <button class="icon-btn" type="button" data-copy="endRange" title="Copy" aria-label="Copy end range">
                            <svg><use href="#i-copy" /></svg>
                        </button>
                    </div>
                </div>
            </div>

            <button class="refresh-btn" type="button" id="refreshButton">
                <svg><use href="#i-refresh" /></svg>
                <span id="refreshLabel">Refresh</span>
            </button>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ---------- Theme ----------
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(theme) {
            root.setAttribute('data-bs-theme', theme);
            const next = theme === 'dark' ? 'light' : 'dark';
            themeToggle.innerHTML = `<svg><use href="#i-${theme === 'dark' ? 'sun' : 'moon'}" /></svg>`;
            themeToggle.setAttribute('aria-label', `Switch to ${next} theme`);
            try { localStorage.setItem('theme', theme); } catch (e) { }
        }

        let savedTheme = 'dark';
        try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (e) { }
        applyTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            applyTheme(root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        });

        // ---------- Helpers ----------
        function setValue(id, text, state) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.classList.toggle('loading', state === 'loading');
            el.classList.toggle('muted', state === 'muted');
            el.dataset.copyable = state ? '' : '1';
        }

        const getIP = url => fetch(url).then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }).then(data => data.ip);

        // ---------- Fetch ----------
        function fetchIPAndUpdateUI() {
            const refreshButton = document.getElementById('refreshButton');
            refreshButton.disabled = true;
            refreshButton.classList.add('spinning');
            document.getElementById('refreshLabel').textContent = 'Loading...';

            setValue('ipAddress', 'Fetching...', 'loading');
            setValue('ipv6Address', 'Fetching...', 'loading');
            setValue('startRange', '-', 'loading');
            setValue('endRange', '-', 'loading');
            document.getElementById('subnetCidr').textContent = '-';

            const ipv4Request = getIP('https://api.ipify.org?format=json')
                .then(ip => {
                    setValue('ipAddress', ip);
                    const prefix = ip.substring(0, ip.lastIndexOf('.'));
                    setValue('startRange', prefix + '.0');
                    setValue('endRange', prefix + '.255');
                    document.getElementById('subnetCidr').textContent = prefix + '.0/24';
                })
                .catch(error => {
                    console.error('IPv4 error:', error);
                    setValue('ipAddress', 'Unavailable', 'muted');
                    setValue('startRange', '-', 'muted');
                    setValue('endRange', '-', 'muted');
                });

            // api64 returns IPv6 when the client has it, otherwise falls back to IPv4
            const ipv6Request = getIP('https://api64.ipify.org?format=json')
                .then(ip => {
                    if (ip.includes(':')) {
                        setValue('ipv6Address', ip);
                    } else {
                        setValue('ipv6Address', 'Not available (no IPv6 connectivity)', 'muted');
                    }
                })
                .catch(error => {
                    console.error('IPv6 error:', error);
                    setValue('ipv6Address', 'Unavailable', 'muted');
                });

            Promise.allSettled([ipv4Request, ipv6Request]).finally(() => {
                refreshButton.disabled = false;
                refreshButton.classList.remove('spinning');
                document.getElementById('refreshLabel').textContent = 'Refresh';
            });
        }

        // ---------- Copy ----------
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast glass-toast align-items-center';
            toast.role = 'status';
            toast.innerHTML = '<div class="d-flex"><div class="toast-body"></div>' +
                '<button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>';
            toast.querySelector('.toast-body').textContent = message;
            document.querySelector('.toast-container').appendChild(toast);
            toast.addEventListener('hidden.bs.toast', () => toast.remove());
            new bootstrap.Toast(toast, { delay: 2000 }).show();
        }

        async function copyValue(button) {
            const el = document.getElementById(button.dataset.copy);
            if (el.dataset.copyable !== '1' || button.classList.contains('copied')) return;
            const text = el.textContent;
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const tmp = document.createElement('textarea');
                tmp.value = text;
                document.body.appendChild(tmp);
                tmp.select();
                document.execCommand('copy');
                tmp.remove();
            }
            const original = button.innerHTML;
            button.classList.add('copied');
            button.innerHTML = '<svg><use href="#i-check" /></svg>';
            setTimeout(() => {
                button.classList.remove('copied');
                button.innerHTML = original;
            }, 1500);
            showToast(`${text} copied to clipboard`);
        }

        document.querySelectorAll('[data-copy]').forEach(btn =>
            btn.addEventListener('click', () => copyValue(btn)));
        document.getElementById('refreshButton').addEventListener('click', fetchIPAndUpdateUI);

        fetchIPAndUpdateUI();
    </script>
</body>

</html>
