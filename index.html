<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check My IP - Find Your Public IPv4 &amp; IPv6 Address</title>
    <meta name="description"
        content="Instantly see your public IPv4 and IPv6 address and your /24 subnet range. Free, fast, no tracking, and copy any value in one click.">
    <link rel="canonical" href="https://adarshjambhulkar.github.io/check-my-ip/">

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Check My IP - Find Your Public IPv4 & IPv6 Address">
    <meta property="og:description"
        content="Instantly see your public IPv4 and IPv6 address and your /24 subnet range.">
    <meta property="og:url" content="https://adarshjambhulkar.github.io/check-my-ip/">
    <meta property="og:image" content="https://adarshjambhulkar.github.io/check-my-ip/assets/icons/apple-touch-icon.png">
    <meta name="twitter:card" content="summary">

    <!-- Icons -->
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0a0f1c">

    <!-- Warm up connections to the IP lookup APIs -->
    <link rel="preconnect" href="https://api.ipify.org" crossorigin>
    <link rel="preconnect" href="https://api64.ipify.org" crossorigin>

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <!-- Applies saved theme before first paint -->
    <script src="assets/js/theme.js"></script>
</head>

<body>
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- SVG icon sprites -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
        </symbol>
    </svg>

    <main class="app">
        <div class="glass">
            <header class="header">
                <div>
                    <h1 class="title">Check My IP</h1>
                    <p class="subtitle">Your public IPv4 and IPv6 addresses</p>
                </div>
                <button class="icon-btn" type="button" id="themeToggle" aria-label="Switch to light theme"
                    title="Toggle theme">
                    <svg><use href="#i-sun" /></svg>
                </button>
            </header>

            <!-- IPv4 -->
            <div class="glass-tile tile">
                <div class="tile-body">
                    <div class="ip-label">IPv4</div>
                    <div class="ip-value loading" id="ipAddress">Fetching...</div>
                </div>
                <button class="icon-btn" type="button" data-copy="ipAddress" title="Copy" aria-label="Copy IPv4">
                    <svg><use href="#i-copy" /></svg>
                </button>
            </div>

            <!-- IPv6 -->
            <div class="glass-tile tile">
                <div class="tile-body">
                    <div class="ip-label">IPv6</div>
                    <div class="ip-value loading" id="ipv6Address">Fetching...</div>
                </div>
                <button class="icon-btn" type="button" data-copy="ipv6Address" title="Copy" aria-label="Copy IPv6">
                    <svg><use href="#i-copy" /></svg>
                </button>
            </div>

            <!-- Subnet -->
            <div class="section-head">
                <h2 class="section-title">IPv4 Subnet Range</h2>
                <span class="cidr" id="subnetCidr">-</span>
            </div>
            <div class="range-grid">
                <div class="glass-tile tile">
                    <div class="tile-body">
                        <div class="ip-label">Start</div>
                        <div class="ip-value loading" id="startRange">-</div>
                    </div>
                    <button class="icon-btn" type="button" data-copy="startRange" title="Copy" aria-label="Copy start range">
                        <svg><use href="#i-copy" /></svg>
                    </button>
                </div>
                <div class="glass-tile tile">
                    <div class="tile-body">
                        <div class="ip-label">End</div>
                        <div class="ip-value loading" id="endRange">-</div>
                    </div>
                    <button class="icon-btn" type="button" data-copy="endRange" title="Copy" aria-label="Copy end range">
                        <svg><use href="#i-copy" /></svg>
                    </button>
                </div>
            </div>

            <button class="refresh-btn" type="button" id="refreshButton">
                <svg aria-hidden="true"><use href="#i-refresh" /></svg>
                <span id="refreshLabel">Refresh</span>
            </button>
        </div>
    </main>

    <div class="toast-container" aria-live="polite"></div>

    <script src="assets/js/ip-service.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/copy-buttons.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
